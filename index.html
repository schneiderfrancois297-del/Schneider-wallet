<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schneider Wallet</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0d1117;
  color: white;
  padding: 20px;
}

.app {
  max-width: 500px;
  margin: auto;
}

h1 {
  text-align: center;
  margin: 15px 0 25px;
}

.balance {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  padding: 25px;
  border-radius: 20px;
  margin-bottom: 20px;
}

.balance p {
  opacity: .8;
  margin-bottom: 8px;
}

.balance h2 {
  font-size: 32px;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-bottom: 25px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.deposit {
  background: #22c55e;
  color: white;
  flex: 1;
}

.withdraw {
  background: #ef4444;
  color: white;
  flex: 1;
}

.card {
  background: #161b22;
  padding: 20px;
  border-radius: 18px;
}

.card h3 {
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: none;
  border-radius: 10px;
  background: #30363d;
  color: white;
  font-size: 16px;
}

.save {
  width: 100%;
  background: #2563eb;
  color: white;
  margin-top: 8px;
}

#history {
  margin-top: 20px;
}

.transaction {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #30363d;
}

.green {
  color: #22c55e;
}

.red {
  color: #ef4444;
}

.note {
  text-align: center;
  margin-top: 25px;
  color: #8b949e;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="app">

<h1>💰 Schneider Wallet</h1>

<div class="balance">
  <p>Balans mwen</p>
  <h2 id="balance">$0.00</h2>
</div>

<div class="buttons">
  <button class="deposit" onclick="showDeposit()">➕ Depo</button>
  <button class="withdraw" onclick="showWithdraw()">➖ Depans</button>
</div>

<div class="card">

<h3 id="title">Ajoute yon tranzaksyon</h3>

<input id="amount" type="number" placeholder="Montan">
<input id="description" type="text" placeholder="Deskripsyon">

<button class="save" onclick="saveTransaction()">
  Anrejistre
</button>

</div>

<div class="card" id="history">
<h3>📜 Istwa</h3>
<div id="transactions">
  <p style="color:#8b949e;">Pa gen tranzaksyon ankò.</p>
</div>
</div>

<p class="note">
Schneider Wallet — Demo wallet sèlman. Li pa konekte ak lajan reyèl.
</p>

</div>

<script>

let balance = 0;
let type = "deposit";

function showDeposit() {
  type = "deposit";
  document.getElementById("title").innerText = "➕ Ajoute lajan";
}

function showWithdraw() {
  type = "withdraw";
  document.getElementById("title").innerText = "➖ Anrejistre depans";
}

function saveTransaction() {

  let amount = parseFloat(document.getElementById("amount").value);
  let description = document.getElementById("description").value;

  if (!amount || amount <= 0) {
    alert("Tanpri mete yon montan.");
    return;
  }

  if (!description) {
    description = type === "deposit" ? "Depo" : "Depans";
  }

  if (type === "withdraw" && amount > balance) {
    alert("Balans lan pa ase.");
    return;
  }

  if (type === "deposit") {
    balance += amount;
  } else {
    balance -= amount;
  }

  document.getElementById("balance").innerText =
    "$" + balance.toFixed(2);

  let transaction = document.createElement("div");
  transaction.className = "transaction";

  let sign = type === "deposit" ? "+" : "-";
  let color = type === "deposit" ? "green" : "red";

  transaction.innerHTML =
    "<span>" + description + "</span>" +
    "<strong class='" + color + "'>" +
    sign + "$" + amount.toFixed(2) +
    "</strong>";

  let list = document.getElementById("transactions");

  if (list.innerText.includes("Pa gen tranzaksyon")) {
    list.innerHTML = "";
  }

  list.prepend(transaction);

  document.getElementById("amount").value = "";
  document.getElementById("description").value = "";
}

</script>

</body>
</html>
